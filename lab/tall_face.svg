<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -570 320 470" width="640" height="940">
  <!-- The tall one's face (night 12), close up, exactly as the game draws it now.
       Units: 1 = 1 mm of the creature's head; y runs down. Edit the shapes of #eye-left, #eye-right and #mouth
       (and the face too, if you like), keep the ids, and paste the SVG back: they will be turned back into the
       game's drawing code. The mouth's outline is drawn with a round-joined stroke (stroke-width 24) to soften
       its corners; keep or change that too. -->
  <rect x="-160" y="-570" width="320" height="470" fill="#14161c"/>
  <ellipse id="head" cx="0" cy="-340" rx="130" ry="200" fill="#08070a"/>
  <ellipse id="face" cx="0" cy="-320" rx="95" ry="150" fill="#786c6e"/>
  <path id="eye-left" d="M -9.0,-366.0 C -28.8,-396.1 -58.5,-390.4 -75.0,-353.0 C -55.2,-342.9 -25.5,-346.7 -9.0,-366.0 Z" fill="#060507"/>
  <path id="eye-right" d="M 9.0,-366.0 C 28.8,-396.1 58.5,-390.4 75.0,-353.0 C 55.2,-342.9 25.5,-346.7 9.0,-366.0 Z" fill="#060507"/>
  <path id="mouth" d="M -50.0,-242.12 C -27.5,-257.76 27.5,-257.76 50.0,-242.12 C 52.0,-222.8 49.0,-206.7 39.0,-209.0 C 17.5,-205.32 -17.5,-205.32 -39.0,-209.0 C -49.0,-206.7 -52.0,-222.8 -50.0,-242.12 Z" fill="#020203" stroke="#020203" stroke-width="24" stroke-linejoin="round"/>
</svg>
