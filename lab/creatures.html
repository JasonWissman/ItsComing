<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creature Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a darkroom contact sheet. A sticky bar of global controls, then one frame per creature in night order;
   "Tune" opens one creature large beside its controls and notes. Single dark theme: the creatures are drawn for the dark. */
:root {
  --bg: #0e0f12; --panel: #16181d; --panel-2: #1d2027; --line: #2a2e37; --fg: #e6e2d8; --muted: #8d8b85;
  --accent: #c9a35b; --accent-ink: #17130b; --warn: #e07a6a;
  --display: 'EB Garamond', Georgia, 'Times New Roman', serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 14px 12px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: end; justify-content: space-between; }
h1 { font: 500 28px/1 var(--display); letter-spacing: 0.02em; margin: 0; font-variant: small-caps; }
h1 small { display: block; font: 12px/1.4 var(--body); color: var(--muted); letter-spacing: 0; font-variant: normal; margin-top: 6px; max-width: 46ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--accent); }
label.lbl { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
button { font: 500 13px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer; }
button:hover { border-color: #3a3f4b; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
input[type=range] { accent-color: var(--accent); width: 120px; }

main.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .head { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 9px; }
.card .who { font: 500 19px/1.1 var(--display); }
.card .night { font: 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.card canvas { display: block; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; cursor: pointer; background: #000; }
.card .foot { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.card .foot button { padding: 6px 9px; }
.anim-name { min-width: 0; text-align: center; font-size: 13px; line-height: 1.25; }
.anim-name b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.anim-name span { font: 11px var(--mono); color: var(--muted); }
.card .tools { display: flex; gap: 6px; justify-content: space-between; padding: 0 10px 10px; }
.has-note { color: var(--accent); }

dialog { width: min(1100px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); }
dialog::backdrop { background: rgba(5, 6, 8, 0.78); }
.tune { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.tune .stage { background: #000; min-width: 0; }
.tune .stage canvas { display: block; width: 100%; aspect-ratio: 3 / 4; max-height: calc(100vh - 60px); cursor: pointer; }
.tune .side { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: auto; max-height: calc(100vh - 26px); }
.tune h2 { font: 500 26px/1.05 var(--display); margin: 0; }
.tune .sub { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.anims { display: flex; flex-direction: column; gap: 4px; }
.anims button { text-align: left; display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; line-height: 1.3; }
.anims button[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
.anims button em { font-style: normal; color: var(--accent); font: 11px var(--mono); }
.what { color: var(--muted); font-size: 13px; max-width: 60ch; margin: 0; }
.row { display: grid; grid-template-columns: 74px 1fr 52px; gap: 10px; align-items: center; }
.row input[type=range] { width: 100%; }
.row output { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row .lbl { font-size: 10px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font: 13px/1.45 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
#copyOut { display: none; }
#copyOut.show { display: block; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 9px 14px; border-radius: 6px; font-weight: 500; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
@media (max-width: 760px) {
  .tune { grid-template-columns: 1fr; }
  .tune .stage canvas { max-height: 56vh; aspect-ratio: auto; height: 56vh; }
  .tune .side { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Creature Lab<small>Every creature, drawn by the game's own code. Click a frame to step through its animations; Tune opens it large with sliders and a notes box.</small></h1>
  <div class="controls">
    <button id="play" class="primary" aria-pressed="true">Pause</button>
    <label class="lbl" for="speed">Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    <span class="seg" role="group" aria-label="Scale"><button id="scFit" aria-pressed="true">Fill frame</button><button id="scTrue" aria-pressed="false">True size</button></span>
    <span class="seg" role="group" aria-label="Background"><button data-bg="night" aria-pressed="true">Night</button><button data-bg="grey" aria-pressed="false">Grey</button><button data-bg="pale" aria-pressed="false">Pale</button></span>
    <button id="copy">Copy notes</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<textarea id="copyOut" aria-label="Your notes, ready to copy"></textarea>

<dialog id="tune" aria-labelledby="tuneTitle">
  <div class="tune">
    <div class="stage"><canvas id="big" tabindex="0" aria-label="The creature, large. Click for the next animation."></canvas></div>
    <div class="side">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:start">
        <div><div class="sub" id="tuneNight"></div><h2 id="tuneTitle"></h2></div>
        <button id="close" aria-label="Close">Close</button>
      </div>
      <div class="anims" id="animList"></div>
      <p class="what" id="what"></p>
      <div class="row"><span class="lbl">Time</span><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Time through the loop"><output id="scrubOut">0.0 s</output></div>
      <div class="btns"><button id="bPlay">Pause</button><button id="bBack">−1 frame</button><button id="bFwd">+1 frame</button><button id="bRestart">Restart</button></div>
      <div class="row"><span class="lbl">Distance</span><input type="range" id="dist" min="0.5" max="60" step="0.5" aria-label="Distance from you, metres"><output id="distOut"></output></div>
      <div class="row"><span class="lbl">Light</span><input type="range" id="lit" min="0" max="1" step="0.05" value="0" aria-label="How lit it is"><output id="litOut"></output></div>
      <div class="row"><span class="lbl">Fog</span><input type="range" id="fog" min="0" max="0.9" step="0.05" value="0" aria-label="Fog"><output id="fogOut"></output></div>
      <label class="lbl" style="gap:6px"><input type="checkbox" id="grid1"> Metre marks</label>
      <div>
        <label class="lbl" for="note" style="margin-bottom:6px">Notes on this animation</label>
        <textarea id="note" placeholder="What should change? e.g. the arms swing too evenly; the head should snap faster"></textarea>
      </div>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="../js/util.js"></script>
<script src="../js/light.js"></script>
<script src="../js/creatures.js"></script>
<script src="../js/creatures/walker.js"></script>
<script src="../js/creatures/crawler.js"></script>
<script src="../js/creatures/smiler.js"></script>
<script src="../js/creatures/watcher.js"></script>
<script src="../js/creatures/runner.js"></script>
<script src="../js/creatures/swimmer.js"></script>
<script src="../js/creatures/climber.js"></script>
<script src="../js/creatures/customer.js"></script>
<script src="../js/creatures/signalman.js"></script>
<script src="../js/creatures/other.js"></script>
<script src="../js/creatures/carrier.js"></script>
<script src="../js/creatures/tall.js"></script>
<script src="../js/creatures/demon.js"></script>
<script src="../js/icons.js"></script>
<script src="lab.js"></script>
<script src="poses/walker.js"></script>
<script src="poses/crawler.js"></script>
<script src="poses/smiler.js"></script>
<script src="poses/watcher.js"></script>
<script src="poses/runner.js"></script>
<script src="poses/swimmer.js"></script>
<script src="poses/climber.js"></script>
<script src="poses/customer.js"></script>
<script src="poses/signalman.js"></script>
<script src="poses/other.js"></script>
<script src="poses/carrier.js"></script>
<script src="poses/tall.js"></script>
<script src="poses/demon.js"></script>
<script src="ui.js"></script>
</body>
</html>
