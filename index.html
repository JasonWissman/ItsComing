  .ncard { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; width: 100%; min-height: 42px; padding: 8px 16px; text-align: left; text-transform: none; letter-spacing: .04em; font-size: calc(15px * var(--text-scale)); }
  .ncard .nname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ncard .nbest { flex: none; display: flex; align-items: baseline; gap: 6px; font-size: calc(14px * var(--text-scale)); color: rgba(207,200,186,.75); font-variant-numeric: tabular-nums; }
  .ncard .nbest small { font-size: calc(10px * var(--text-scale)); letter-spacing: .14em; text-transform: uppercase; color: rgba(207,200,186,.42); }
  /* a night reached: shown, not pressed (no night is picked from the list), so drawn like a button at rest, never lit */
  .ncard.shown { background: rgba(0,0,0,.45); border: 1px solid rgba(207,200,186,.22); color: #efe6d2; cursor: default; }
  .ncard.locked { display: flex; color: rgba(207,200,186,.3); border: 1px solid rgba(207,200,186,.1); }
  .runcard { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; box-sizing: border-box; margin: 14px auto 0; padding: 14px 18px 12px; background: rgba(207,200,186,.035); border-radius: 10px; }
  .runcard .rlabel { font-size: calc(11px * var(--text-scale)); letter-spacing: .3em; text-transform: uppercase; color: rgba(207,200,186,.55); }
  .runcard .rtime { font-size: calc(42px * var(--text-scale)); line-height: 1.15; color: #efe6d2; font-variant-numeric: tabular-nums; }
  .runcard .rtime.none { color: rgba(207,200,186,.45); }
  .runcard .rhint { font-size: calc(13px * var(--text-scale)); font-style: italic; color: rgba(207,200,186,.55); }
  #overlay.dlg > .panel.nightsp { padding-top: 20px; padding-bottom: 18px; }
  #overlay.dlg > .panel.nightsp h1 { margin: 0 0 12px; }
  #overlay.dlg > .panel.nightsp .mrow { margin-top: 12px; }
  @media (max-width: 640px) { .nights { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; gap: 5px; } .nights > .c1, .nights > .c2 { grid-column: auto; } .ncard { min-height: 38px; padding: 6px 14px; } .runcard { margin-top: 10px; padding: 10px 14px; } .runcard .rtime { font-size: calc(34px * var(--text-scale)); } }
  /* after the ending: the nights again, as on the Nights screen, each card taking its time in turn (MENU reveal), then the
     full run, then Finish game. Over the morning room, so mostly in the day colours below */
  #overlay > .results { box-sizing: border-box; width: min(760px, 100%); max-width: 760px; max-height: 100%; overflow: auto; cursor: default; padding: 4px 2px; }
  .results h1 { margin: 2px 0 14px !important; }
  .rcard { background: rgba(0,0,0,.45); border: 1px solid rgba(207,200,186,.16); color: rgba(239,230,210,.5); transition: color .6s, border-color .6s, background-color .6s; }
  .rcard .nbest { opacity: 0; transform: translateX(-8px); transition: opacity .6s ease-out, transform .6s ease-out; }
  .rcard.in { color: #efe6d2; border-color: rgba(207,200,186,.4); animation: rfill 1.2s ease-out; }
  .rcard.in .nbest { opacity: 1; transform: none; }
  @keyframes rfill { 0% { box-shadow: 0 0 0 rgba(239,230,210,0); } 20% { box-shadow: 0 0 22px rgba(239,230,210,.28); } 100% { box-shadow: 0 0 0 rgba(239,230,210,0); } }
  .rrun .rtime { opacity: 0; transform: scale(.94); transition: opacity 1.1s ease-out, transform 1.1s ease-out; }
  .rrun.in .rtime { opacity: 1; transform: none; }
  .rrun.in { animation: rfill 1.8s ease-out; }
  .rlast { opacity: 0; visibility: hidden; transition: opacity .9s, visibility 0s .9s; }
  .rlast.in { opacity: 1; visibility: visible; transition: opacity .9s; }
  .results.still .rcard, .results.still .nbest, .results.still .rtime, .results.still .rlast { transition: none; animation: none; }
  .results.still .rcard.in, .results.still .rrun.in { animation: none; }
  :root[data-theme="day"] .rcard { background: rgba(255,255,255,.4); border-color: rgba(58,51,44,.14); color: rgba(46,40,35,.45); }
  :root[data-theme="day"] .rcard.in { background: rgba(255,255,255,.62); border-color: rgba(58,51,44,.35); color: #2e2823; }
  :root[data-theme="day"] .rcard .nbest { color: rgba(46,40,35,.8); }
  @media (max-width: 640px) { #overlay > .results { padding: 0; } .results .ncard { min-height: 33px; padding: 4px 12px; } .results .nights { gap: 4px; } .results h1 { margin-bottom: 8px !important; } .results .rlast { margin-top: 10px; } }
  /* a small dialog over a dialog: erasing progress asks first */
  #overlay .confirm { position: fixed; inset: 0; z-index: 2; max-width: none; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.6); cursor: default; }
  .confirm .cpanel { box-sizing: border-box; width: min(380px, 100%); padding: 24px 28px 18px; background: rgba(7,7,9,.98); border: 1px solid rgba(207,200,186,.22); box-shadow: 0 24px 90px #000; text-align: center; }
  .confirm h2 { font-weight: normal; font-size: 28px; letter-spacing: .04em; margin: 0 0 8px; color: #efe6d2; }
  .confirm p { margin: 0 0 6px; font-size: calc(14px * var(--text-scale)); line-height: 1.5; color: rgba(207,200,186,.7); }
  .confirm .mrow { margin-top: 16px; }
  .confirm .mbtn { min-width: 0; flex: 1; }
  .settings { display: flex; flex-direction: column; gap: 10px; margin: 10px auto; text-align: left; width: max-content; max-width: 100%; }
  .opt { display: flex; align-items: center; gap: 12px; font-size: calc(15px * var(--text-scale)); color: rgba(207,200,186,.85); cursor: pointer; }
  .opt span { min-width: 90px; }
  .opt input[type=range] { width: 180px; accent-color: #efe6d2; }
  .opt input[type=checkbox] { accent-color: #efe6d2; width: 16px; height: 16px; }
  button:focus-visible { outline: 1px solid rgba(239,230,210,.9); outline-offset: 2px; }
  #overlay .hint { font-style: italic; color: rgba(239,230,210,.85); font-size: calc(17px * var(--text-scale)); }
  #overlay .prompt { margin-top: 28px; font-size: calc(13px * var(--text-scale)); letter-spacing: .2em; text-transform: uppercase; color: rgba(207,200,186,.55); animation: breathe 3s ease-in-out infinite; }
  #overlay .prompt .alt { display: inline-block; margin-top: 10px; text-transform: none; letter-spacing: .06em; font-size: 13px; color: rgba(207,200,186,.7); }
  #overlay .fine { font-size: calc(11px * var(--text-scale)); color: rgba(207,200,186,.35); margin-top: 28px; letter-spacing: .06em; }
  #overlay .credit a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
  #overlay .credit a:hover, #overlay .credit a:focus-visible { color: #efe6d2; }
  :root[data-theme="day"] #overlay .credit a:hover { color: #1a1612; }
  #overlay .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; font-size: calc(14px * var(--text-scale)); color: rgba(207,200,186,.7); margin: 8px auto 0; text-align: left; width: max-content; max-width: 100%; }
  #overlay .controls b { color: #efe6d2; font-weight: normal; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #caption { position: fixed; z-index: 6; pointer-events: none; bottom: 190px; left: 50%; transform: translateX(-50%); font-size: calc(14px * var(--text-scale)); font-style: italic; color: rgba(239,230,210,.85); text-shadow: 0 1px 2px #000, 0 0 10px #000; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #caption.show { opacity: 1; }

  :root[data-theme="day"] .opt, :root[data-theme="day"] #overlay .controls b { color: #2e2823; }
  :root[data-theme="day"] #overlay .prompt, :root[data-theme="day"] #overlay .prompt .alt { color: rgba(58,51,44,.7); }
  :root[data-theme="day"] .mbtn.danger { color: #8f1a20; border-color: rgba(143,26,32,.5); }
  :root[data-theme="day"] #overlay .kicker { color: rgba(58,51,44,.75); }
  /* a phone or a tablet (a coarse pointer): swipe on the view to look, tap to use (js/game.js: touch). Two small buttons
     instead of the keys: zoom (a tap: on, lit, its plus a minus; a tap again: off) in the bottom right corner, and the menu, top left where the sound line is on a
     desktop (the pause menu has Mute in it). Both only while a night is being played. A third, full screen, top right
     from the title on (#fsBtn, below) */
  #zoomBtn, #menuBtn, #fsBtn { display: none; position: fixed; z-index: 6; box-sizing: border-box; align-items: center; justify-content: center; padding: 0; color: rgba(239,230,210,.8); background: rgba(0,0,0,.42); border: 1px solid rgba(207,200,186,.28); touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; cursor: pointer; }
  #zoomBtn { right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%; flex-direction: column; gap: 1px; font: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
  #zoomBtn svg { width: 24px; height: 24px; }
  #zoomBtn span { margin-right: -.18em; }
  #zoomBtn.on { color: #0b0a0a; background: rgba(239,230,210,.86); border-color: #efe6d2; box-shadow: 0 0 14px rgba(239,230,210,.3); }
  #zoomBtn.on .zplus { display: none; }   /* on: the plus turns to a minus (a tap zooms back out) */
  #menuBtn { top: 12px; left: max(14px, env(safe-area-inset-left)); width: 40px; height: 36px; border-radius: 6px; }
  #menuBtn span, #menuBtn span::before, #menuBtn span::after { display: block; width: 18px; height: 2px; background: currentColor; border-radius: 1px; }
  #menuBtn span { position: relative; }
  #menuBtn span::before, #menuBtn span::after { content: ''; position: absolute; left: 0; }
  #menuBtn span::before { top: -6px; } #menuBtn span::after { top: 6px; }
  #menuBtn:active { color: #efe6d2; border-color: rgba(239,230,210,.8); }
  /* full screen (the Fullscreen API, where the browser has it for the page: body.fsok): top right, clear of the compass in
     the middle and of the notch; the same button leaves it again, its corners turned in (.on) */
  #fsBtn { z-index: 7; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 40px; height: 36px; border-radius: 6px; }
  #fsBtn svg { width: 20px; height: 20px; }
  #fsBtn .fsout, #fsBtn.on .fsin { display: none; }
  #fsBtn.on .fsout { display: block; }
  #fsBtn:active { color: #efe6d2; border-color: rgba(239,230,210,.8); }
  :root[data-theme="day"] #zoomBtn, :root[data-theme="day"] #menuBtn, :root[data-theme="day"] #fsBtn { color: #2e2823; background: rgba(255,255,255,.55); border-color: rgba(58,51,44,.35); }
  :root[data-theme="day"] #zoomBtn.on { color: #f4efe6; background: rgba(46,40,35,.86); border-color: #2e2823; }
  /* held in portrait: a screen over everything asking for it turned sideways, and the night paused behind it */
  #rotate { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; box-sizing: border-box; text-align: center; background: radial-gradient(ellipse at 50% 42%, #14110f, #000 70%); color: #efe6d2; touch-action: none; }
  #rotate svg { width: 120px; height: 120px; margin-bottom: 14px; color: #efe6d2; }
  #rotate .rphone { transform-origin: 60px 54px; animation: rturn 2.8s ease-in-out infinite; }
  #rotate h2 { margin: 0; font-weight: normal; font-size: 26px; letter-spacing: .06em; }
  #rotate p { margin: 6px 0 0; max-width: 18em; font-size: 15px; line-height: 1.5; font-style: italic; color: rgba(207,200,186,.6); }
  @keyframes rturn { 0%, 20% { transform: none; } 50%, 80% { transform: rotate(-90deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #rotate .rphone { animation: none; transform: rotate(-90deg); } }

    #mute { display: none; }
    body.tplay #menuBtn, body.tzoom #zoomBtn { display: flex; }
    body.menu #menuBtn, body.menu #zoomBtn { display: none; }
    body.fsok #fsBtn { display: flex; }

    #overlay { padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left)); }
    /* the things held float over the view, each on a faint backing of its own, no strip under them: the view runs

    #inventory { gap: 8px; bottom: calc(env(safe-area-inset-bottom) + 18px); touch-action: none; }

    .slot.active { border-color: rgba(239,230,210,.75); background: radial-gradient(closest-side, rgba(8,7,7,.48), rgba(8,7,7,.3)); box-shadow: 0 2px 10px rgba(0,0,0,.35), 0 0 10px rgba(239,230,210,.16); }
    :root[data-theme="day"] .slot { background: radial-gradient(closest-side, rgba(255,255,255,.42), rgba(255,255,255,.24)); box-shadow: 0 2px 10px rgba(58,51,44,.18); }
    :root[data-theme="day"] .slot.active { background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.34)); }
    #compass { top: 18px; } #pitch { top: 40px; } #zoom { top: 58px; } #toast { top: calc(var(--view-top, 0px) + 80px); } #objective { top: 14px; }
  }

  @media (max-width: 700px) { #compass { top: 44px; } #pitch { top: 74px; } #zoom { top: 94px; } #toast { top: calc(var(--view-top, 0px) + 116px); } #objective { top: 44px; } #overlay h1.big { font-size: 42px; } #overlay h1 { font-size: 30px; } #overlay .intro { font-size: calc(15px * var(--text-scale)); } #objective { max-width: 48vw; font-size: calc(12px * var(--text-scale)); } #compass { gap: 10px; font-size: 11px; } }
