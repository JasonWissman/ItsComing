<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>It's Coming</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23000%27/%3E%3Cellipse cx=%2716%27 cy=%2712%27 rx=%275%27 ry=%277%27 fill=%27%23d8d0c0%27/%3E%3Ccircle cx=%2714%27 cy=%2711%27 r=%271%27/%3E%3Ccircle cx=%2718%27 cy=%2711%27 r=%271%27/%3E%3Cellipse cx=%2716%27 cy=%2715.5%27 rx=%271.4%27 ry=%272%27/%3E%3Cpath d=%27M11 30 L13 19 L19 19 L21 30 Z%27 fill=%27%23111%27/%3E%3C/svg%3E">
<meta name="description" content="A first-person browser horror game. Something is coming straight at you. Look away to survive; look back and it is closer.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #cfc8ba; font-family: Georgia, 'Times New Roman', serif; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #hud.dim { opacity: 0 !important; }
  #compass { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; font-size: 13px; letter-spacing: .18em; color: rgba(207,200,186,.35); }
  #compass span { position: relative; padding: 4px 2px; transition: color .2s; }
  #compass span.cur { color: #efe6d2; }
  #compass span.thing::after { content: ''; position: absolute; left: 50%; bottom: -3px; width: 4px; height: 4px; margin-left: -2px; background: #a2121a; border-radius: 50%; }
  #pitch { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .14em; color: rgba(207,200,186,.35); text-transform: uppercase; }
  #zoom { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .3em; color: rgba(239,230,210,.7); transition: opacity .2s; }
  #objective { position: absolute; top: 16px; right: 20px; max-width: 34vw; text-align: right; font-size: 14px; line-height: 1.4; color: rgba(207,200,186,.7); font-style: italic; }
  #mute { position: fixed; top: 16px; left: 20px; z-index: 6; font-size: 11px; letter-spacing: .12em; color: rgba(207,200,186,.45); cursor: pointer; text-transform: uppercase; padding: 4px 6px; }
  #mute:hover { color: #efe6d2; }
  #mute.off { color: #b3161e; }
  #tooltip { position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #efe6d2; text-shadow: 0 1px 2px #000, 0 0 12px #000; display: none; font-style: italic; }
  #toast { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); font-size: 17px; color: #efe6d2; text-shadow: 0 1px 2px #000, 0 0 14px #000; opacity: 0; transition: opacity .35s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #holdbar { display: none; position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%); width: 180px; height: 4px; background: rgba(207,200,186,.18); }
  #holdfill { height: 100%; width: 0; background: #efe6d2; transition: width .05s linear; }
  .linkbtn { font: inherit; background: none; border: none; color: #efe6d2; text-decoration: underline; cursor: pointer; padding: 0; letter-spacing: inherit; }
  .fragment { display: block; margin-top: 10px; font-size: 15px; color: rgba(207,200,186,.6); }
  #inventory { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
  .slot { width: 64px; height: 64px; border: 1px solid rgba(207,200,186,.18); background: rgba(0,0,0,.45); position: relative; cursor: pointer; transition: border-color .15s; }
  .slot canvas { width: 64px; height: 64px; display: block; }
  .slot.active { border-color: rgba(239,230,210,.75); box-shadow: 0 0 10px rgba(239,230,210,.12); }
  .slot .label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; font-size: 10px; letter-spacing: .08em; white-space: nowrap; color: rgba(207,200,186,.6); }
  #debug { display: none; position: absolute; bottom: 6px; left: 8px; font: 11px monospace; color: #7c7; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .5s; padding: 24px; box-sizing: border-box; }
  #overlay.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  #overlay > * { max-width: 720px; }
  #overlay h1 { font-weight: normal; font-size: 40px; letter-spacing: .08em; margin: 8px 0 18px; color: #efe6d2; text-shadow: 0 0 30px rgba(0,0,0,.9); }
  #overlay h1.big { font-size: 64px; letter-spacing: .22em; }
  #overlay h1.red { color: #b3161e; }
  #overlay .kicker { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: rgba(207,200,186,.5); }
  :root { --text-scale: 1; }
  #overlay .intro { font-size: calc(18px * var(--text-scale)); line-height: 1.6; color: #cfc8ba; margin: 0 auto 14px; }
  .mrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 18px auto 6px; }
  .mcol { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 18px auto 6px; }
  .mbtn { font-family: inherit; font-size: calc(15px * var(--text-scale)); letter-spacing: .12em; text-transform: uppercase; background: rgba(0,0,0,.45); border: 1px solid rgba(207,200,186,.3); color: #efe6d2; padding: 10px 22px; min-width: 200px; cursor: pointer; transition: border-color .15s, background .15s; }
  .mbtn:hover, .mbtn:focus-visible { border-color: rgba(239,230,210,.9); background: rgba(40,36,32,.6); outline: none; box-shadow: 0 0 12px rgba(239,230,210,.15); }
  .mbtn.danger { border-color: rgba(179,22,30,.5); color: #d08a8e; }
  .mbtn.danger:hover, .mbtn.danger:focus-visible { border-color: #b3161e; }
  .frags { display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 8px auto 4px; text-align: left; max-height: 52vh; overflow-y: auto; padding: 4px; }
  .frag { font-size: 15px; line-height: 1.5; color: #cfc8bc; }
  .frag .fn { color: #8d8579; margin-right: 6px; }
  .frag.unseen .fdots { color: #5c5650; letter-spacing: 4px; }
  :root[data-theme="day"] html, :root[data-theme="day"] body { background: #e9e4da; color: #3a332c; }
  :root[data-theme="day"] #overlay { background: rgba(240,236,228,.86); }
  :root[data-theme="day"] #overlay h1 { color: #2e2823; text-shadow: none; }
  :root[data-theme="day"] #overlay h1.big { color: #2e2823; }
  :root[data-theme="day"] #overlay .kicker { color: rgba(58,51,44,.55); }
  :root[data-theme="day"] #overlay .intro, :root[data-theme="day"] .frag, :root[data-theme="day"] .controls, :root[data-theme="day"] .fine { color: #3a332c; }
  :root[data-theme="day"] .mbtn, :root[data-theme="day"] .diff { background: rgba(255,255,255,.55); border-color: rgba(58,51,44,.35); color: #2e2823; }
  :root[data-theme="day"] .mbtn:hover, :root[data-theme="day"] .mbtn:focus-visible, :root[data-theme="day"] .diff.sel { border-color: #2e2823; background: rgba(255,255,255,.85); box-shadow: 0 0 12px rgba(58,51,44,.12); }
  :root[data-theme="day"] .frag .fn { color: #8a8072; }
  :root[data-theme="day"] .frag.unseen .fdots { color: #b8b0a4; }
  :root[data-theme="day"] .nrow .times, :root[data-theme="day"] .nrow .bt small { color: rgba(58,51,44,.6); }
  :root[data-theme="day"] .nrow.locked .nlock { color: rgba(58,51,44,.3); border-color: rgba(58,51,44,.15); }
  :root[data-theme="day"] #mute { color: rgba(58,51,44,.5); }
  :root[data-theme="day"] #toast, :root[data-theme="day"] #tooltip { color: #2e2823; text-shadow: 0 1px 2px #fff, 0 0 12px #fff; }
  .nights { display: flex; flex-direction: column; gap: 6px; margin: 8px auto; max-height: 52vh; overflow-y: auto; padding: 4px; }
  .nrow { display: flex; align-items: center; gap: 14px; justify-content: center; }
  .nrow .nbtn { min-width: 260px; text-align: left; text-transform: none; letter-spacing: .04em; }
  .nrow .times { display: flex; gap: 10px; font-size: 12px; color: rgba(207,200,186,.6); min-width: 240px; text-align: left; }
  .nrow .bt small { display: block; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: rgba(207,200,186,.4); }
  .nrow.locked .nlock { display: inline-block; min-width: 260px; text-align: left; padding: 10px 22px; color: rgba(207,200,186,.3); border: 1px solid rgba(207,200,186,.1); }
  .settings { display: flex; flex-direction: column; gap: 10px; margin: 10px auto; text-align: left; width: max-content; max-width: 100%; }
  .opt { display: flex; align-items: center; gap: 12px; font-size: calc(15px * var(--text-scale)); color: rgba(207,200,186,.85); cursor: pointer; }
  .opt span { min-width: 90px; }
  .opt input[type=range] { width: 180px; accent-color: #efe6d2; }
  .opt input[type=checkbox] { accent-color: #efe6d2; width: 16px; height: 16px; }
  button:focus-visible, .diff:focus-visible { outline: 1px solid rgba(239,230,210,.9); outline-offset: 2px; }
  #overlay .hint { font-style: italic; color: rgba(239,230,210,.85); font-size: calc(17px * var(--text-scale)); }
  #overlay .prompt { margin-top: 28px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: rgba(207,200,186,.55); animation: breathe 3s ease-in-out infinite; }
  #overlay .prompt .alt { display: inline-block; margin-top: 10px; text-transform: none; letter-spacing: .06em; font-size: 13px; color: rgba(207,200,186,.7); }
  #overlay .fine { font-size: 11px; color: rgba(207,200,186,.35); margin-top: 28px; letter-spacing: .06em; }
  #overlay .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; font-size: 14px; color: rgba(207,200,186,.7); margin: 8px auto 0; text-align: left; width: max-content; max-width: 100%; }
  #overlay .controls b { color: #efe6d2; font-weight: normal; }
  .diffs { display: flex; gap: 10px; justify-content: center; margin: 22px auto 4px; flex-wrap: wrap; }
  .diff { font-family: inherit; background: rgba(0,0,0,.45); border: 1px solid rgba(207,200,186,.22); color: rgba(207,200,186,.75); padding: 10px 16px; min-width: 150px; text-align: left; cursor: pointer; letter-spacing: .06em; font-size: 15px; transition: border-color .15s, color .15s; }
  .diff small { display: block; font-size: 11px; letter-spacing: .02em; color: rgba(207,200,186,.5); margin-top: 4px; }
  .diff .key { display: inline-block; width: 16px; font-size: 11px; color: rgba(207,200,186,.4); }
  .diff:hover { border-color: rgba(239,230,210,.5); color: #efe6d2; }
  .diff.sel { border-color: rgba(239,230,210,.85); color: #efe6d2; box-shadow: 0 0 12px rgba(239,230,210,.12); }
  .diff.sel small { color: rgba(207,200,186,.75); }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #touch { display: none; position: fixed; right: 14px; bottom: 14px; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; z-index: 5; }
  #touch button { background: rgba(0,0,0,.5); border: 1px solid rgba(207,200,186,.3); color: #efe6d2; font-size: 18px; border-radius: 6px; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #touch #tZoom { grid-column: 3; grid-row: 1 / span 2; font-size: 11px; letter-spacing: .1em; }
  @media (pointer: coarse) { #touch { display: grid; } #inventory { left: 18px; transform: none; } #tooltip, #toast { bottom: 140px; } }
  @media (max-width: 700px) { #compass { top: 44px; } #pitch { top: 74px; } #zoom { top: 94px; } #objective { top: 44px; } #overlay h1.big { font-size: 42px; } #overlay h1 { font-size: 30px; } #overlay .intro { font-size: 15px; } #objective { max-width: 48vw; font-size: 12px; } #compass { gap: 10px; font-size: 11px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="compass"></div>
  <div id="pitch"></div>
  <div id="zoom">Z O O M</div>
  <div id="objective"></div>
  <div id="tooltip"></div>
  <div id="toast"></div>
  <div id="holdbar"><div id="holdfill"></div></div>
  <div id="inventory"></div>
  <div id="debug"></div>
</div>
<div id="touch">
  <button id="tLeft" aria-label="turn left">◀</button>
  <button id="tUp" aria-label="look ahead">▲</button>
  <button id="tZoom" aria-label="zoom">ZOOM</button>
  <button id="tDown" aria-label="look down">▼</button>
  <button id="tRight" aria-label="turn right">▶</button>
</div>
<div id="overlay"></div>
<div id="mute">sound on (M)</div>
