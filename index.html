  #overlay .notebody a { color: #efe6d2; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; }

  /* its foot: the two links out side by side (one over the other on a phone), Back under them */

  .notefoot { flex-direction: column; align-items: center; }

  .notefoot .mbtn { line-height: calc(19px * min(var(--text-scale), 1.4)); }   /* (one line height for the three: the links' smaller words still at Back's height) */
  .notefoot { width: 100%; } .notelinks .mbtn { font-size: calc(12.5px * min(var(--text-scale), 1.4)); letter-spacing: .08em; padding-left: 12px; padding-right: 12px; }   /* (each link's label on its one line, the two across the whole dialog) */
  @media (max-width: 640px) { #overlay .notebody h1 { font-size: 28px; } .notelinks { flex-direction: column; gap: 8px; } .notefoot .mbtn { padding-top: 9px; padding-bottom: 9px; } .notefoot > .mbtn { width: 100%; } }
  @media (max-height: 520px) { #overlay .notebody h1 { font-size: 24px; margin: 0 0 8px; } #overlay .notebody p { font-size: calc(14px * min(var(--text-scale), 1.6)); line-height: 1.5; } #overlay.dlg > .panel.notep { padding-bottom: 10px; } #overlay.dlg > .panel.notep > .mrow { margin-top: 8px; padding-top: 10px; gap: 8px; } .notefoot .mbtn { padding-top: 6px; padding-bottom: 6px; font-size: calc(15px * min(var(--text-scale), 1.3)); }
    .notefoot { flex-direction: row; } .notelinks { flex: 2 1 0; flex-direction: row; } .notelinks .mbtn { flex: 1 1 auto; padding-left: 14px; padding-right: 14px; } .notefoot > .mbtn { flex: 0 1 auto; width: auto; min-width: 120px; } }
  @media (max-height: 520px) { .notefoot .mbtn { line-height: calc(19px * min(var(--text-scale), 1.3)); } .notelinks .mbtn { padding-left: 10px; padding-right: 10px; font-size: calc(11px * min(var(--text-scale), 1.3)); letter-spacing: .06em; } }
  :root[data-theme="day"] #overlay .notebody p { color: #3a332c; }
  :root[data-theme="day"] #overlay .notebody a { color: #1a1612; }
  #overlay .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; font-size: calc(14px * var(--text-scale)); color: rgba(207,200,186,.7); margin: 8px auto 0; text-align: left; width: max-content; max-width: 100%; }
  #overlay .controls b { color: #efe6d2; font-weight: normal; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* a caption for a sound (js/captions.js): a small speaker and its line, in the top left corner under the sound line (on
     a phone: under the menu button), the one corner with nothing of the night in it on a desktop or a phone (the things
     held are along the bottom, at the left on a phone; the hand holding one at the bottom right, over the zoom button; the
     note for a secret is at the top in the middle, and ends above this). One line, which ends above the line of words under
     the compass (#toast) and short of the middle (#pitch, #zoom), so it is never over either; a line too long for that
     is set smaller, not cut short (CAPTIONS put). Over everything but the turn-it-sideways screen (the volume dialog's own
     caption is seen in the warning's card too) */
  #caption { position: fixed; z-index: 1001; pointer-events: none; top: 50px; left: 20px; box-sizing: border-box; max-width: calc(50vw - 95px); display: flex; align-items: center; gap: .45em; font-size: min(calc(14px * var(--text-scale)), 2vw); line-height: 1.25; font-style: italic; color: rgba(239,230,210,.85); text-shadow: 0 1px 2px #000, 0 0 10px #000; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #caption.show { opacity: 1; }
  #caption svg { flex: none; width: 1em; height: 1em; opacity: .8; filter: drop-shadow(0 1px 2px #000); }
  #caption .ctx { min-width: 0; overflow: hidden; text-overflow: ellipsis; padding-right: .2em; }   /* (the padding: an italic's last letter leans out of its box) */
  :root[data-theme="day"] #caption { color: #2e2823; text-shadow: 0 1px 2px #fff; }
  :root[data-theme="day"] #caption svg { filter: none; }
  :root[data-theme="day"] .opt, :root[data-theme="day"] #overlay .controls b { color: #2e2823; }
  :root[data-theme="day"] #overlay .prompt, :root[data-theme="day"] #overlay .prompt .alt { color: rgba(58,51,44,.7); }
  :root[data-theme="day"] .mbtn.danger { color: #8f1a20; border-color: rgba(143,26,32,.5); }   /* (on the pale sheet a darker red: the bright one is too faint on it) */
  :root[data-theme="day"] .mbtn.quiet { background: none; border-color: transparent; color: rgba(58,51,44,.7); }
  :root[data-theme="day"] #overlay .kicker { color: rgba(58,51,44,.75); }
  /* a phone or a tablet (a coarse pointer): swipe on the view to look, tap to use (js/game.js: touch). Two small buttons
     instead of the keys: zoom (a tap: on, lit, its plus a minus; a tap again: off) in the bottom right corner, and the menu, top left where the sound line is on a
     desktop (the pause menu has Mute in it). Zoom only while a night is being played; the menu then, and over a night's
     card, the death screen and the win screen too (the pause menu is the way to Quit). A third, full screen, top right
     from the title on (#fsBtn, below) */
  #zoomBtn, #menuBtn, #fsBtn { display: none; position: fixed; z-index: 6; box-sizing: border-box; align-items: center; justify-content: center; padding: 0; color: rgba(239,230,210,.8); background: rgba(0,0,0,.42); border: 1px solid rgba(207,200,186,.28); touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; cursor: pointer; }
  #zoomBtn { right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%; flex-direction: column; gap: 1px; font: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
  #zoomBtn svg { width: 24px; height: 24px; }
  #zoomBtn span { margin-right: -.18em; }
  #zoomBtn.on { color: #0b0a0a; background: rgba(239,230,210,.86); border-color: #efe6d2; box-shadow: 0 0 14px rgba(239,230,210,.3); }
  #zoomBtn.on .zplus { display: none; }   /* on: the plus turns to a minus (a tap zooms back out) */
  #menuBtn { top: 12px; left: max(14px, env(safe-area-inset-left)); width: 40px; height: 36px; border-radius: 6px; }
  #menuBtn span, #menuBtn span::before, #menuBtn span::after { display: block; width: 18px; height: 2px; background: currentColor; border-radius: 1px; }
  #menuBtn span { position: relative; }
  #menuBtn span::before, #menuBtn span::after { content: ''; position: absolute; left: 0; }
  #menuBtn span::before { top: -6px; } #menuBtn span::after { top: 6px; }
  #menuBtn:active { color: #efe6d2; border-color: rgba(239,230,210,.8); }
  /* full screen (the Fullscreen API, where the browser has it for the page: body.fsok): top right, clear of the compass in
     the middle and of the notch; the same button leaves it again, its corners turned in (.on) */
  #fsBtn { z-index: 7; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 40px; height: 36px; border-radius: 6px; }
  #fsBtn svg { width: 20px; height: 20px; }
  #fsBtn .fsout, #fsBtn.on .fsin { display: none; }
  #fsBtn.on .fsout { display: block; }
  #fsBtn:active { color: #efe6d2; border-color: rgba(239,230,210,.8); }
  /* on a desktop as well (F does the same), on the title and in play: smaller and fainter, brighter under the mouse; the
     objective at the top right keeps clear of it */
  body.fsok #fsBtn { display: flex; }
  body.fsok #objective { right: 66px; }
  @media (pointer: fine) {
    #fsBtn { top: 14px; right: 16px; width: 34px; height: 30px; color: rgba(207,200,186,.5); background: rgba(0,0,0,.25); border-color: rgba(207,200,186,.18); }
    #fsBtn svg { width: 16px; height: 16px; }
    #fsBtn:hover, #fsBtn:focus-visible { color: #efe6d2; border-color: rgba(239,230,210,.55); }
  }
  :root[data-theme="day"] #zoomBtn, :root[data-theme="day"] #menuBtn, :root[data-theme="day"] #fsBtn { color: #2e2823; background: rgba(255,255,255,.55); border-color: rgba(58,51,44,.35); }
  :root[data-theme="day"] #zoomBtn.on { color: #f4efe6; background: rgba(46,40,35,.86); border-color: #2e2823; }
  /* held in portrait: a screen over everything asking for it turned sideways, and the night paused behind it */
  #rotate { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; box-sizing: border-box; text-align: center; background: radial-gradient(ellipse at 50% 42%, #14110f, #000 70%); color: #efe6d2; touch-action: none; }
  #rotate svg { width: 120px; height: 120px; margin-bottom: 14px; color: #efe6d2; }
  #rotate .rphone { transform-origin: 60px 54px; animation: rturn 2.8s ease-in-out infinite; }
  #rotate h2 { margin: 0; font-weight: normal; font-size: calc(18.6px * var(--text-scale)); letter-spacing: .06em; }
  #rotate p { margin: 6px 0 0; max-width: 18em; font-size: calc(10.7px * var(--text-scale)); line-height: 1.5; font-style: italic; color: rgba(207,200,186,.6); }
  @keyframes rturn { 0%, 20% { transform: none; } 50%, 80% { transform: rotate(-90deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #rotate .rphone { animation: none; transform: none; } }   /* (still: the phone upright, the arrow by its corner, as the turn begins: turned, the arrow would cross it) */

    #game, #hud { touch-action: none; }
    #mute { display: none; }
    body.tplay #menuBtn, body.tzoom #zoomBtn { display: flex; }
    body.menu #zoomBtn { display: none; }   /* (the menu button stays over a night's card, the death screen and the win screen: body.tplay is on only where the pause menu can be opened, js/game.js touchChrome) */
    #menuBtn { top: max(12px, env(safe-area-inset-top)); }
    /* a sound's caption under the menu button, a little smaller: its one line ends above the words under the compass */
    #caption.cal { top: max(8px, env(safe-area-inset-top)); }   /* (the volume dialog's: no menu button there, and the dialog fills a phone: in the corner by its heading, over none of its words) */
    #caption { top: calc(max(12px, env(safe-area-inset-top)) + 42px); left: max(14px, env(safe-area-inset-left)); max-width: calc(50vw - 48px - max(14px, env(safe-area-inset-left))); font-size: min(calc(13px * var(--text-scale)), 2.1vw, 19px); }
    #objective { right: max(20px, calc(env(safe-area-inset-right) + 6px)); }

    #overlay { padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left)); }
    /* (opened from the Home Screen the page runs under the notch and the rounded corners: the dialogs kept clear of them) */
    #overlay.dlg { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    /* the things held float over the view, each on a faint backing of its own, no strip under them: the view runs
       to the bottom of the screen (and under the home bar: viewport-fit=cover), the slots above that bar */
    /* (in the lower left corner, not the middle: the middle of the bottom edge is where things to tap most often are) */
    #inventory { gap: 8px; left: max(16px, env(safe-area-inset-left)); transform: none; touch-action: none; }
    .slot, .slot canvas { width: 50px; height: 50px; }
    #inventory.many { gap: 4px; max-width: calc(100% - 180px); }   /* (clear of the zoom button in the corner) */
    #inventory.many .slot, #inventory.many .slot canvas { width: 34px; height: 34px; }

    :root[data-theme="day"] .slot { background: radial-gradient(closest-side, rgba(255,255,255,.42), rgba(255,255,255,.24)); box-shadow: 0 2px 10px rgba(58,51,44,.18); }
