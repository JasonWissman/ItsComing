name: test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: lint
        run: npx eslint js test lab
      - name: the vendored three matches the pinned package
        run: node lab/tools/vendor.js && git diff --exit-code --stat -- lab/vendor
      - name: every sound exists and every cue has a caption
        run: node test/sounds.js
      - name: lanes, switches, story, flow, features
        run: node test/lanes.js && node test/switch.js && node test/story.js && node test/flow.js && node test/features.js
      - name: every night's solution (every tier, one seed)
        run: TIERS=normal,hard,nightmare SEEDS=1 node test/play.js
      - name: clickability sweep
        run: N=8 node test/hittest.js
      - name: the 3D lab (software WebGL)
        run: node test/lab.js
      - name: the ink lab (the game's renderer, more ink)
        run: node test/lab2d.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-shots
          path: test/shots/lab*.png
          if-no-files-found: ignore
