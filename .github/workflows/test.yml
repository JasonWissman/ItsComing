name: test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  headless:
    # pinned: Playwright 1.56 cannot install its browser on ubuntu-latest once that is 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: lint
        run: npx eslint js test
      - name: every sound exists and every cue has a caption
        run: node test/sounds.js
      - name: lanes, switches, story, flow, features
        run: node test/lanes.js && node test/switch.js && node test/story.js && node test/flow.js && node test/features.js
      - name: every night's solution (every tier, one seed)
        run: TIERS=normal,nightmare SEEDS=1 node test/play.js
      - name: clickability sweep
        run: N=8 node test/hittest.js
